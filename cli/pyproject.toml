[project]
name = "sleeper-agent"
version = "0.1.0"
description = "LLM-driven Sleeper fantasy football team management CLI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "polars>=1.9",
    "requests>=2.32",
    "nfl-data-py>=0.3.3",
    "pyyaml>=6.0",
    "pyarrow>=25.0.0",
]

[project.scripts]
sleeper-agent = "sleeper_agent.main:run"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sleeper_agent"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
