name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies (fail on stale lockfile)
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ty check
        run: uv run ty check

      - name: no-dynamic-magic check
        run: uv run python scripts/check_no_magic.py

      - name: pytest with 100% coverage gate
        run: uv run pytest --cov=sleeper_agent --cov-report=term-missing --cov-fail-under=100
